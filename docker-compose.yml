services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: acil
      POSTGRES_PASSWORD: acil
      POSTGRES_DB: acil
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acil -d acil"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      ACIL_DATABASE_URL: postgresql+psycopg://acil:acil@postgres:5432/acil
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
